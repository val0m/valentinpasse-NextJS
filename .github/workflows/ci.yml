name: CI

on:
  push:
    branches: [Master]
  pull_request:
    branches: [Master]

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --coverage --coverageThreshold='{"global":{"lines":40,"statements":40,"functions":30,"branches":40}}'

      - name: Build
        run: npm run build
